<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quote mark">
  <rect width="64" height="64" rx="13" fill="#ffc247"/>
  <!--
    An opening double quote, drawn as geometry rather than set as text: a
    favicon cannot rely on a font being installed, and paths stay identical
    wherever this renders. Each mark is a ball with a tail sweeping up and to
    the right. The pair is nudged left so it sits optically centred, since the
    tails push the visual weight rightwards.
  -->
  <g fill="#0b0d11" transform="translate(-2.5 0)">
    <circle cx="21" cy="40" r="7.5"/>
    <path d="M17.6 34.8 27.2 15.4 33.4 18.5 23.8 37.9Z"/>
    <circle cx="43" cy="40" r="7.5"/>
    <path d="M39.6 34.8 49.2 15.4 55.4 18.5 45.8 37.9Z"/>
  </g>
</svg>
